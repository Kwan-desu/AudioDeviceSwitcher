name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Restore & Publish WinUI 3 App (win-x64)
        shell: pwsh
        run: |
          dotnet restore AudioDeviceSwitcher.WinUI/AudioDeviceSwitcher.WinUI.csproj -r win-x64
          $publishDir = (Join-Path $PWD "publish\winui") + "\"
          msbuild AudioDeviceSwitcher.WinUI\AudioDeviceSwitcher.WinUI.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishDir="$publishDir"

      - name: Package WinUI payload zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path AudioDeviceSwitcherInstaller/payload.zip) {
            Remove-Item AudioDeviceSwitcherInstaller/payload.zip -Force
          }
          $tagName = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "win-x64" }
          $zipName = if ($env:GITHUB_REF_TYPE -eq "tag") { "AudioDeviceSwitcher-WinUI-$tagName-win-x64.zip" } else { "AudioDeviceSwitcher-WinUI-win-x64.zip" }
          Compress-Archive -Path publish/winui/* -DestinationPath AudioDeviceSwitcherInstaller/payload.zip -CompressionLevel Optimal
          Copy-Item AudioDeviceSwitcherInstaller/payload.zip "artifacts/$zipName"

      - name: Publish Single-File Portable & Installer EXE (win-x64)
        shell: pwsh
        run: |
          dotnet publish AudioDeviceSwitcherInstaller/AudioDeviceSwitcherInstaller.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish/installer

          Copy-Item publish/installer/AudioDeviceSwitcherInstaller.exe artifacts/AudioDeviceSwitcherInstaller.exe
          Copy-Item publish/installer/AudioDeviceSwitcherInstaller.exe artifacts/AudioDeviceSwitcher.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioDeviceSwitcher-win-x64
          path: artifacts/*
          retention-days: 30

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag artifacts/* `
            --title "Audio Device Switcher $tag" `
            --generate-notes `
            --latest
